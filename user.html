<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f6f1">
	<title>Sign in | Wordwise</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #26332c;
			--muted: #68736b;
			--paper: #f5f6f1;
			--green: #708069;
			--green-dark: #4c5949;
			--line: #dce3d8;
			--white: #fff;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#70806916 0.8px, transparent 0.8px);
			background-size: 20px 20px;
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}
		main { min-height: 100vh; display: grid; place-items: center; padding: 40px 22px; }
		.login-content { width: min(100%, 440px); animation: arrive 500ms ease-out both; }
		.brand { margin: 0 0 40px; color: var(--green-dark); font: 700 25px Georgia, "Times New Roman", serif; }
		.eyebrow { margin: 0 0 12px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
		h1 { margin: 0; font: 400 48px/1.1 Georgia, "Times New Roman", serif; }
		.intro { margin: 14px 0 26px; color: var(--muted); font-size: 15px; line-height: 1.6; }
		.mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 20px; padding: 4px; border: 1px solid var(--line); background: #e9eee7; }
		.mode-button { min-height: 42px; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
		.mode-button[aria-pressed="true"] { color: var(--green-dark); background: var(--white); box-shadow: 0 1px 3px #26332c18; }
		form { display: grid; gap: 15px; }
		label { display: grid; gap: 7px; color: var(--ink); font-size: 13px; font-weight: 700; }
		input { width: 100%; min-height: 48px; padding: 0 13px; border: 1px solid #b9c4b5; border-radius: 3px; color: var(--ink); background: var(--white); font: inherit; font-size: 15px; }
		input:focus-visible { outline: 3px solid #aeb9a8; outline-offset: 2px; }
		.submit-button { min-height: 48px; margin-top: 6px; border: 1px solid var(--green-dark); border-radius: 3px; color: var(--white); background: var(--green-dark); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
		.submit-button:hover { background: #394536; }
		button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
		.status { min-height: 24px; margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
		.status[data-error="true"] { color: #8d3935; }
		.privacy-note { margin: 18px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
		@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 480px) { h1 { font-size: 40px; } .brand { margin-bottom: 32px; } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
	</style>
</head>
<body data-page="login">
	<main>
		<section class="login-content" aria-labelledby="page-title">
			<p class="brand">Wordwise</p>
			<p class="eyebrow">Your learning, saved</p>
			<h1 id="page-title">Welcome back</h1>
			<p class="intro">Sign in to continue your Chinese studies, or create an account to begin.</p>
			<div class="mode-switch" role="group" aria-label="Account action">
				<button class="mode-button" id="login-mode" type="button" aria-pressed="true">Log in</button>
				<button class="mode-button" id="create-mode" type="button" aria-pressed="false">Create account</button>
			</div>
			<form id="account-form">
				<label for="username">Username
					<input id="username" name="username" type="text" minlength="3" maxlength="24" autocomplete="username" required>
				</label>
				<label for="password">Password
					<input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
				</label>
				<button class="submit-button" id="submit-account" type="submit">Log in</button>
			</form>
			<p class="status" id="account-status" role="status" aria-live="polite"></p>
			<p class="privacy-note">Accounts and progress are stored in this browser on this device.</p>
		</section>
	</main>
	<script src="User.js" defer></script>
</body>
</html>
